<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Profile</title>

<link
rel="stylesheet"
href="css/profile.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="profile-card">

<h1>

<i class="fa-solid fa-user"></i>

Profile Settings

</h1>

<div class="image-section">

<img

id="profile-image"

src="https://via.placeholder.com/150"

alt="Profile">

<input

type="file"

id="image-input"

accept="image/*">

</div>

<input

type="text"

id="profile-name"

placeholder="Name">

<input

type="email"

id="profile-email"

placeholder="Email">

<select id="currency-select">

<option value="₹">₹ INR</option>

<option value="$">$ USD</option>

<option value="€">€ EUR</option>

<option value="£">£ GBP</option>

</select>

<label>

<input

type="checkbox"

id="dark-mode">

Enable Dark Mode

</label>

<button id="save-profile">

Save Changes

</button>

<br><br>

<a href="index.html">

← Back to Dashboard

</a>

</div>

<script src="js/profile.js"></script>

</body>

</html>
