<!DOCTYPE html>

<!--
The <html> tag is called the ROOT ELEMENT.

Every HTML document must have exactly one <html> tag.

The "lang" attribute tells browsers and search engines
what language the webpage uses.

This also helps screen readers for accessibility.
-->
<html lang="en">

<head>

    <!--
    Character Encoding

    UTF-8 supports almost every character and symbol in the world.

    Without UTF-8, some special characters may display incorrectly.
    -->
    <meta charset="UTF-8">

    <!--
    Viewport Meta Tag

    This tells mobile browsers how to scale the webpage.

    Without this tag:

    ❌ Mobile layout becomes tiny.

    With this tag:

    ✅ Responsive design works correctly.
    -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!--
    Short description of the webpage.

    Search engines may use this in search results.

    Good descriptions improve SEO.
    -->
    <meta
        name="description"
        content="FinTrack V3 - Professional Expense Tracker built using HTML, CSS and JavaScript">

    <!--
    Browser Tab Title

    Appears at the top of the browser tab.
    -->
    <title>FinTrack V3 | Expense Tracker</title>

    <!--
    Google Fonts

    We'll use the Poppins font throughout the project.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!--
    Font Awesome

    Provides thousands of ready-made icons.

    Example:
    Wallet
    Money
    Home
    User
    Search
    Chart
    -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!--
    Main Stylesheet

    All basic styling will be written here.
    -->
    <link rel="stylesheet" href="css/style.css">

    <!--
    Responsive CSS

    Media queries for tablets and mobile devices.
    -->
    <link rel="stylesheet" href="css/responsive.css">

    <!--
    Animation CSS

    Contains transitions and animations.
    -->
    <link rel="stylesheet" href="css/animations.css">

    <!--
    Dark Theme CSS

    Activated when dark mode is enabled.
    -->
    <link rel="stylesheet" href="css/darkmode.css">

</head>

                <i class="fa-solid fa-moon"></i>

            </button>

            <button class="profile-btn" aria-label="Open user profile">

                <i class="fa-solid fa-user"></i>

            </button>

        </div>

    </nav>

</header>
