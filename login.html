<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login | FinTrack</title>

<link
rel="stylesheet"
href="css/login.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>

            <i class="fa-solid fa-wallet"></i>

            FinTrack

        </h1>

        <h2>

            Login

        </h2>

        <form id="login-form">

            <input
            type="email"
            id="login-email"
            placeholder="Email"
            required>

           <div class="password-box">

<input
type="password"
id="login-password"
placeholder="Password"
required>

<i
class="fa-solid fa-eye"
id="toggle-login-password">

</i>

</div>

<label>

<input
type="checkbox"
id="remember-me">

Remember Me

</label>
            <button type="submit">

                Login

            </button>

        </form>

        <p>

            Don't have an account?

            <a href="register.html">

                Register

            </a>

        </p>

    </div>

</div>

<script src="js/auth.js"></script>

</body>

</html>
